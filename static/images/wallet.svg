<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-wallet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140f0b"/>
      <stop offset="100%" stop-color="#2a1b12"/>
    </linearGradient>
    <linearGradient id="leather-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="50%" stop-color="#542307"/>
      <stop offset="100%" stop-color="#3d1803"/>
    </linearGradient>
    <linearGradient id="leather-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#92400e"/>
      <stop offset="100%" stop-color="#692d07"/>
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <filter id="shadow-wallet" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="400" height="240" fill="url(#bg-wallet)"/>

  <!-- Wallet Body Base Shadow -->
  <rect x="110" y="55" width="180" height="130" rx="14" fill="#000" opacity="0.4" filter="url(#shadow-wallet)"/>

  <!-- Back Flap -->
  <rect x="105" y="50" width="190" height="140" rx="14" fill="url(#leather-dark)" stroke="#92400e" stroke-width="1.5"/>

  <!-- White Stitching line along perimeter -->
  <rect x="111" y="56" width="178" height="128" rx="10" fill="none" stroke="#d97706" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- Inside Cards peeking out -->
  <!-- Transit / ID Card -->
  <rect x="130" y="36" width="90" height="40" rx="6" fill="url(#card-grad)" stroke="#38bdf8" stroke-width="1" transform="rotate(-6 130 36)"/>
  <rect x="135" y="44" width="20" height="8" rx="2" fill="#e0f2fe" opacity="0.8" transform="rotate(-6 130 36)"/>

  <!-- Student Card -->
  <rect x="180" y="38" width="85" height="40" rx="6" fill="#10b981" stroke="#34d399" stroke-width="1" transform="rotate(4 180 38)"/>
  <rect x="188" y="45" width="24" height="6" rx="2" fill="#ffffff" opacity="0.8" transform="rotate(4 180 38)"/>

  <!-- Front Bi-Fold Flap -->
  <rect x="105" y="70" width="190" height="120" rx="14" fill="url(#leather-light)" stroke="#b45309" stroke-width="1.5"/>
  <!-- Front flap stitching -->
  <rect x="111" y="76" width="178" height="108" rx="10" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- Embossed Brand Badge Center -->
  <rect x="160" y="115" width="80" height="24" rx="4" fill="#542307" stroke="#92400e" stroke-width="1"/>
  <text x="200" y="131" font-family="serif" font-size="10" font-weight="bold" fill="#d97706" text-anchor="middle" letter-spacing="2">FOSSIL</text>

  <!-- Coin/Token Pocket line -->
  <line x1="120" y1="160" x2="280" y2="160" stroke="#78350f" stroke-width="2"/>

  <!-- Category Tag -->
  <rect x="20" y="20" width="76" height="22" rx="11" fill="rgba(217,119,6,0.15)" stroke="rgba(217,119,6,0.4)" stroke-width="1"/>
  <text x="58" y="35" font-family="sans-serif" font-size="9" font-weight="bold" fill="#fcd34d" text-anchor="middle">👝 WALLET</text>
</svg>
