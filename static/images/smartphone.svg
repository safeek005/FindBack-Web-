<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-phone" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="phone-body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="screen-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="glow-phone" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="240" fill="url(#bg-phone)"/>
  <circle cx="200" cy="120" r="85" fill="#3b82f6" opacity="0.15" filter="url(#glow-phone)"/>

  <!-- Phone Shadow -->
  <rect x="156" y="28" width="88" height="184" rx="20" fill="#000000" opacity="0.4"/>

  <!-- Phone Outer Chassis -->
  <rect x="152" y="24" width="96" height="188" rx="20" fill="url(#phone-body)" stroke="#60a5fa" stroke-width="2"/>

  <!-- Bezel & Screen -->
  <rect x="158" y="30" width="84" height="176" rx="16" fill="url(#screen-grad)"/>

  <!-- Dynamic Island / Speaker notch -->
  <rect x="186" y="36" width="28" height="8" rx="4" fill="#0f172a" stroke="#334155" stroke-width="0.5"/>
  <circle cx="206" cy="40" r="1.5" fill="#38bdf8"/>

  <!-- Screen Content: Modern Lock Screen & Wallpaper -->
  <rect x="168" y="58" width="64" height="20" rx="4" fill="rgba(255,255,255,0.06)"/>
  <text x="200" y="73" font-family="sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">10:45</text>
  <text x="200" y="86" font-family="sans-serif" font-size="7" fill="#94a3b8" text-anchor="middle">Friday, October 9</text>

  <!-- Dog icon / Wallpaper art -->
  <circle cx="200" cy="120" r="22" fill="#f59e0b" opacity="0.25"/>
  <circle cx="200" cy="120" r="18" fill="#fbbf24"/>
  <!-- Dog Face Features -->
  <ellipse cx="193" cy="116" rx="2" ry="2.5" fill="#1e293b"/>
  <ellipse cx="207" cy="116" rx="2" ry="2.5" fill="#1e293b"/>
  <polygon points="200,121 197,125 203,125" fill="#1e293b"/>
  <!-- Dog Ears -->
  <ellipse cx="186" cy="114" rx="3.5" ry="7" fill="#d97706" transform="rotate(-20 186 114)"/>
  <ellipse cx="214" cy="114" rx="3.5" ry="7" fill="#d97706" transform="rotate(20 214 114)"/>

  <!-- Home Indicator bar -->
  <rect x="185" y="194" width="30" height="3" rx="1.5" fill="#ffffff" opacity="0.7"/>

  <!-- Decorative Badge -->
  <rect x="20" y="20" width="82" height="22" rx="11" fill="rgba(59,130,246,0.15)" stroke="rgba(59,130,246,0.4)" stroke-width="1"/>
  <text x="61" y="35" font-family="sans-serif" font-size="9" font-weight="bold" fill="#93c5fd" text-anchor="middle">📱 SMARTPHONE</text>
</svg>
