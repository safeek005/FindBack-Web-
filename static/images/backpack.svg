<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-backpack" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="pack-black" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="60%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="bungee-cord" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
  </defs>

  <rect width="400" height="240" fill="url(#bg-backpack)"/>

  <!-- Top Handle -->
  <path d="M 180 40 C 180 25, 220 25, 220 40" fill="none" stroke="#475569" stroke-width="7" stroke-linecap="round"/>

  <!-- Shoulder Strap curves behind -->
  <path d="M 170 50 C 120 70, 130 180, 150 195" fill="none" stroke="#1e293b" stroke-width="12" stroke-linecap="round"/>
  <path d="M 230 50 C 280 70, 270 180, 250 195" fill="none" stroke="#1e293b" stroke-width="12" stroke-linecap="round"/>

  <!-- Main Backpack Body -->
  <path d="M 155 55 C 175 42, 225 42, 245 55 C 265 70, 268 185, 250 200 C 230 205, 170 205, 150 200 C 132 185, 135 70, 155 55 Z"
        fill="url(#pack-black)" stroke="#475569" stroke-width="2"/>

  <!-- Front Pocket Section -->
  <path d="M 152 110 C 170 102, 230 102, 248 110 C 260 120, 258 190, 245 196 C 230 200, 170 200, 155 196 C 142 190, 140 120, 152 110 Z"
        fill="#0f172a" stroke="#334155" stroke-width="1.5"/>

  <!-- Bungee / Elastic Cross Cords on Front -->
  <path d="M 160 120 L 240 150 L 160 170 L 240 190" fill="none" stroke="url(#bungee-cord)" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 240 120 L 160 150 L 240 170 L 160 190" fill="none" stroke="url(#bungee-cord)" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Side Mesh Pocket with Water Bottle peeking out -->
  <g transform="translate(130, 115)">
    <!-- Purple Water Bottle -->
    <rect x="-8" y="-20" width="16" height="35" rx="3" fill="#8b5cf6" stroke="#c084fc" stroke-width="1"/>
    <rect x="-4" y="-26" width="8" height="6" rx="2" fill="#e2e8f0"/>
    <!-- Mesh Pocket -->
    <rect x="-10" y="5" width="20" height="40" rx="4" fill="#334155" opacity="0.8"/>
  </g>

  <!-- Zipper Track -->
  <path d="M 156 65 C 180 55, 220 55, 244 65" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="3,2"/>

  <!-- Brand Embroidery Badge -->
  <rect x="185" y="85" width="30" height="12" rx="2" fill="#1e293b" stroke="#475569" stroke-width="0.5"/>
  <text x="200" y="94" font-family="sans-serif" font-size="6" font-weight="bold" fill="#ffffff" text-anchor="middle">BOREALIS</text>

  <!-- Category Tag -->
  <rect x="20" y="20" width="90" height="22" rx="11" fill="rgba(168,85,247,0.15)" stroke="rgba(168,85,247,0.4)" stroke-width="1"/>
  <text x="65" y="35" font-family="sans-serif" font-size="9" font-weight="bold" fill="#d8b4fe" text-anchor="middle">🎒 BACKPACK</text>
</svg>
