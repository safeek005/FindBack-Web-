<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-headphones" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="silver-metal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <linearGradient id="cup-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <filter id="glow-headphones" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="240" fill="url(#bg-headphones)"/>
  <circle cx="200" cy="120" r="90" fill="#6366f1" opacity="0.12" filter="url(#glow-headphones)"/>

  <!-- Zippered travel case background outline -->
  <ellipse cx="200" cy="125" rx="110" ry="85" fill="#182234" stroke="#334155" stroke-width="2"/>
  <!-- Zipper line -->
  <ellipse cx="200" cy="125" rx="104" ry="79" fill="none" stroke="#475569" stroke-width="1.5" stroke-dasharray="3,3"/>

  <!-- Headband Arc -->
  <path d="M 140 135 C 140 65, 260 65, 260 135" fill="none" stroke="url(#silver-metal)" stroke-width="14" stroke-linecap="round"/>
  <path d="M 155 110 C 155 75, 245 75, 245 110" fill="none" stroke="#1e293b" stroke-width="6" stroke-linecap="round"/>

  <!-- Left Ear Cup -->
  <g transform="translate(132, 135)">
    <rect x="-8" y="-10" width="16" height="20" rx="4" fill="url(#silver-metal)"/>
    <ellipse cx="0" cy="20" rx="20" ry="32" fill="#0f172a" stroke="url(#silver-metal)" stroke-width="2"/>
    <ellipse cx="0" cy="20" rx="14" ry="24" fill="url(#cup-grad)"/>
    <!-- Cushion -->
    <ellipse cx="-6" cy="20" rx="6" ry="26" fill="#334155"/>
  </g>

  <!-- Right Ear Cup -->
  <g transform="translate(268, 135)">
    <rect x="-8" y="-10" width="16" height="20" rx="4" fill="url(#silver-metal)"/>
    <ellipse cx="0" cy="20" rx="20" ry="32" fill="#0f172a" stroke="url(#silver-metal)" stroke-width="2"/>
    <ellipse cx="0" cy="20" rx="14" ry="24" fill="url(#cup-grad)"/>
    <!-- Cushion -->
    <ellipse cx="6" cy="20" rx="6" ry="26" fill="#334155"/>
  </g>

  <!-- Brand badge -->
  <rect x="20" y="20" width="94" height="22" rx="11" fill="rgba(99,102,241,0.15)" stroke="rgba(99,102,241,0.4)" stroke-width="1"/>
  <text x="67" y="35" font-family="sans-serif" font-size="9" font-weight="bold" fill="#a5b4fc" text-anchor="middle">🎧 HEADPHONES</text>
</svg>
