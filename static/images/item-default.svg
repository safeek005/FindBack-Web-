<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-default" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="box-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
  </defs>

  <rect width="400" height="240" fill="url(#bg-default)"/>

  <!-- Package / Archive Box Graphic -->
  <g transform="translate(140, 60)">
    <!-- Main Box Body -->
    <rect x="0" y="30" width="120" height="85" rx="8" fill="#1e293b" stroke="#475569" stroke-width="2"/>
    <!-- Lid -->
    <polygon points="-8,30 60,8 128,30 60,42" fill="url(#box-grad)" stroke="#818cf8" stroke-width="1.5"/>
    <polygon points="-8,30 60,42 60,50 -8,38" fill="#4338ca"/>
    <polygon points="128,30 60,42 60,50 128,38" fill="#3730a3"/>

    <!-- Magnifying Glass Icon Over Box -->
    <circle cx="60" cy="70" r="22" fill="none" stroke="#38bdf8" stroke-width="4"/>
    <line x1="76" y1="86" x2="95" y2="105" stroke="#38bdf8" stroke-width="5" stroke-linecap="round"/>
    <circle cx="60" cy="70" r="18" fill="rgba(56,189,248,0.15)"/>
  </g>

  <!-- Title / Disclaimer -->
  <text x="200" y="195" font-family="sans-serif" font-size="11" font-weight="600" fill="#94a3b8" text-anchor="middle">
    FindBack Community Item
  </text>

  <!-- Category Tag -->
  <rect x="20" y="20" width="112" height="22" rx="11" fill="rgba(99,102,241,0.15)" stroke="rgba(99,102,241,0.4)" stroke-width="1"/>
  <text x="76" y="35" font-family="sans-serif" font-size="9" font-weight="bold" fill="#a5b4fc" text-anchor="middle">📦 GENERAL ITEM</text>
</svg>
