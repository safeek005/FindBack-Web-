<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-bottle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <linearGradient id="flask-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#075985"/>
    </linearGradient>
  </defs>

  <rect width="400" height="240" fill="url(#bg-bottle)"/>

  <!-- Bottle shadow -->
  <ellipse cx="200" cy="208" rx="36" ry="10" fill="#000000" opacity="0.4"/>

  <!-- Bottle Cap with Flexible Strap Handle -->
  <path d="M 185 45 C 185 28, 215 28, 215 45" fill="none" stroke="#334155" stroke-width="6" stroke-linecap="round"/>
  <rect x="182" y="42" width="36" height="18" rx="4" fill="#0f172a" stroke="#475569" stroke-width="1.5"/>

  <!-- Neck -->
  <rect x="186" y="60" width="28" height="12" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1"/>

  <!-- Main Flask Cylinder Body -->
  <rect x="170" y="72" width="60" height="130" rx="10" fill="url(#flask-blue)" stroke="#38bdf8" stroke-width="1.5"/>

  <!-- Specular highlight streak -->
  <path d="M 176 80 L 180 80 L 180 194 L 176 194 Z" fill="rgba(255,255,255,0.2)"/>

  <!-- Sticker 1: Mountain Peak Sticker -->
  <g transform="translate(182, 105)">
    <circle cx="18" cy="18" r="14" fill="#f59e0b" stroke="#ffffff" stroke-width="1"/>
    <!-- Mountain Triangles -->
    <polygon points="18,10 9,24 27,24" fill="#1e293b"/>
    <polygon points="23,14 16,24 30,24" fill="#475569"/>
    <!-- Snow peak -->
    <polygon points="18,10 16,14 20,14" fill="#ffffff"/>
  </g>

  <!-- Sticker 2: National Park Oval -->
  <g transform="translate(180, 145)">
    <ellipse cx="20" cy="14" rx="16" ry="10" fill="#10b981" stroke="#ffffff" stroke-width="1"/>
    <text x="20" y="17" font-family="sans-serif" font-size="6" font-weight="bold" fill="#ffffff" text-anchor="middle">PARKS</text>
  </g>

  <!-- Category Tag -->
  <rect x="20" y="20" width="102" height="22" rx="11" fill="rgba(16,185,129,0.15)" stroke="rgba(16,185,129,0.4)" stroke-width="1"/>
  <text x="71" y="35" font-family="sans-serif" font-size="9" font-weight="bold" fill="#6ee7b7" text-anchor="middle">💧 WATER BOTTLE</text>
</svg>
