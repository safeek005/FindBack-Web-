<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-watch" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1f2937"/>
    </linearGradient>
    <linearGradient id="gold-metal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#854d0e"/>
    </linearGradient>
    <linearGradient id="watch-strap" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <rect width="400" height="240" fill="url(#bg-watch)"/>

  <!-- Top Strap -->
  <rect x="180" y="25" width="40" height="60" rx="6" fill="url(#watch-strap)" stroke="#475569" stroke-width="1.5"/>
  <rect x="185" y="35" width="30" height="3" rx="1.5" fill="#1e293b"/>
  <rect x="185" y="45" width="30" height="3" rx="1.5" fill="#1e293b"/>
  <rect x="185" y="55" width="30" height="3" rx="1.5" fill="#1e293b"/>

  <!-- Bottom Strap -->
  <rect x="180" y="155" width="40" height="60" rx="6" fill="url(#watch-strap)" stroke="#475569" stroke-width="1.5"/>
  <rect x="185" y="170" width="30" height="3" rx="1.5" fill="#1e293b"/>
  <rect x="185" y="180" width="30" height="3" rx="1.5" fill="#1e293b"/>

  <!-- Watch Bezel / Case (Round) -->
  <circle cx="200" cy="120" r="50" fill="url(#gold-metal)" stroke="#ca8a04" stroke-width="2"/>
  <!-- Watch Crown button (right) -->
  <rect x="250" y="114" width="8" height="12" rx="2" fill="url(#gold-metal)" stroke="#a16207" stroke-width="1"/>

  <!-- Dial Interior -->
  <circle cx="200" cy="120" r="42" fill="#0f172a" stroke="#334155" stroke-width="1"/>

  <!-- Hour markers -->
  <circle cx="200" cy="85" r="2.5" fill="#fde047"/>  <!-- 12 -->
  <circle cx="235" cy="120" r="2.5" fill="#fde047"/> <!-- 3 -->
  <circle cx="200" cy="155" r="2.5" fill="#fde047"/> <!-- 6 -->
  <circle cx="165" cy="120" r="2.5" fill="#fde047"/> <!-- 9 -->

  <!-- Clock Hands -->
  <!-- Hour hand -->
  <line x1="200" y1="120" x2="182" y2="105" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Minute hand -->
  <line x1="200" y1="120" x2="222" y2="92" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Second hand (red) -->
  <line x1="200" y1="120" x2="200" y2="88" stroke="#ef4444" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Center Pin -->
  <circle cx="200" cy="120" r="3.5" fill="#fde047"/>

  <!-- Category Tag -->
  <rect x="20" y="20" width="76" height="22" rx="11" fill="rgba(234,179,8,0.15)" stroke="rgba(234,179,8,0.4)" stroke-width="1"/>
  <text x="58" y="35" font-family="sans-serif" font-size="9" font-weight="bold" fill="#fef08a" text-anchor="middle">⌚ WATCH</text>
</svg>
