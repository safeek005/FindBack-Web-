<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-notebook" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="book-cover" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="pages-edge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
  </defs>

  <rect width="400" height="240" fill="url(#bg-notebook)"/>

  <!-- Shadow below notebook -->
  <rect x="130" y="45" width="150" height="165" rx="8" fill="#000000" opacity="0.35"/>

  <!-- Back Cover -->
  <rect x="126" y="40" width="155" height="165" rx="8" fill="#065f46" stroke="#047857" stroke-width="1.5"/>

  <!-- Paper Edge Block (right side) -->
  <rect x="270" y="44" width="8" height="157" rx="2" fill="url(#pages-edge)" stroke="#cbd5e1" stroke-width="0.5"/>

  <!-- Front Cover -->
  <rect x="132" y="40" width="144" height="165" rx="8" fill="url(#book-cover)" stroke="#10b981" stroke-width="1.5"/>

  <!-- Spiral Wire Rings along Left Margin -->
  <g fill="#94a3b8" stroke="#475569" stroke-width="1">
    <ellipse cx="132" cy="55" rx="6" ry="3"/>
    <ellipse cx="132" cy="70" rx="6" ry="3"/>
    <ellipse cx="132" cy="85" rx="6" ry="3"/>
    <ellipse cx="132" cy="100" rx="6" ry="3"/>
    <ellipse cx="132" cy="115" rx="6" ry="3"/>
    <ellipse cx="132" cy="130" rx="6" ry="3"/>
    <ellipse cx="132" cy="145" rx="6" ry="3"/>
    <ellipse cx="132" cy="160" rx="6" ry="3"/>
    <ellipse cx="132" cy="175" rx="6" ry="3"/>
    <ellipse cx="132" cy="190" rx="6" ry="3"/>
  </g>

  <!-- Title Label Box on Cover -->
  <rect x="156" y="80" width="100" height="45" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="166" y1="95" x2="246" y2="95" stroke="#3b82f6" stroke-width="1.5"/>
  <line x1="166" y1="105" x2="236" y2="105" stroke="#94a3b8" stroke-width="1"/>
  <line x1="166" y1="115" x2="220" y2="115" stroke="#94a3b8" stroke-width="1"/>

  <!-- Bookmark Ribbon Ribbon Tail -->
  <polygon points="215,200 225,200 230,220 220,214 210,220" fill="#f43f5e"/>

  <!-- Category Tag -->
  <rect x="20" y="20" width="94" height="22" rx="11" fill="rgba(16,185,129,0.15)" stroke="rgba(16,185,129,0.4)" stroke-width="1"/>
  <text x="67" y="35" font-family="sans-serif" font-size="9" font-weight="bold" fill="#6ee7b7" text-anchor="middle">📖 NOTEBOOK</text>
</svg>
