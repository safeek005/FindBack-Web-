<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-glasses" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="tortoise" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="30%" stop-color="#b45309"/>
      <stop offset="60%" stop-color="#451a03"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>
    <linearGradient id="lens-glare" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(147,197,253,0.35)"/>
      <stop offset="60%" stop-color="rgba(255,255,255,0.05)"/>
      <stop offset="100%" stop-color="rgba(147,197,253,0.2)"/>
    </linearGradient>
  </defs>

  <rect width="400" height="240" fill="url(#bg-glasses)"/>

  <!-- Protective Microfiber Pouch behind glasses -->
  <rect x="70" y="55" width="260" height="130" rx="16" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <path d="M 75 75 Q 200 65 325 75" fill="none" stroke="#475569" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- Left Temple (Arm) extending back -->
  <path d="M 120 120 C 105 100, 95 85, 90 90" fill="none" stroke="url(#tortoise)" stroke-width="6" stroke-linecap="round"/>

  <!-- Right Temple (Arm) extending back -->
  <path d="M 280 120 C 295 100, 305 85, 310 90" fill="none" stroke="url(#tortoise)" stroke-width="6" stroke-linecap="round"/>

  <!-- Left Lens Rim -->
  <rect x="120" y="95" width="68" height="52" rx="14" fill="none" stroke="url(#tortoise)" stroke-width="8"/>
  <!-- Left Lens Glass -->
  <rect x="124" y="99" width="60" height="44" rx="10" fill="url(#lens-glare)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  <!-- Lens reflection highlight -->
  <path d="M 132 105 L 148 105 L 138 135 L 128 135 Z" fill="rgba(255,255,255,0.25)"/>

  <!-- Bridge (Middle connecting piece) -->
  <path d="M 188 112 Q 200 106 212 112" fill="none" stroke="#d97706" stroke-width="5" stroke-linecap="round"/>

  <!-- Right Lens Rim -->
  <rect x="212" y="95" width="68" height="52" rx="14" fill="none" stroke="url(#tortoise)" stroke-width="8"/>
  <!-- Right Lens Glass -->
  <rect x="216" y="99" width="60" height="44" rx="10" fill="url(#lens-glare)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  <!-- Lens reflection highlight -->
  <path d="M 224 105 L 240 105 L 230 135 L 220 135 Z" fill="rgba(255,255,255,0.25)"/>

  <!-- Gold Browline Rivets -->
  <circle cx="118" cy="100" r="2.5" fill="#fde047"/>
  <circle cx="282" cy="100" r="2.5" fill="#fde047"/>

  <!-- Category Tag -->
  <rect x="20" y="20" width="82" height="22" rx="11" fill="rgba(245,158,11,0.15)" stroke="rgba(245,158,11,0.4)" stroke-width="1"/>
  <text x="61" y="35" font-family="sans-serif" font-size="9" font-weight="bold" fill="#fde68a" text-anchor="middle">👓 EYEWEAR</text>
</svg>
